[project]
name = "mlteam"
version = "0.1.0"
description = "AI ML Engineering Team - an agentic platform that behaves like an autonomous ML engineering team"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "tabpfn>=2.0",
    "category-encoders>=2.6",
    "feature-engine>=1.8",
    "imbalanced-learn>=0.12",
    "optuna>=3.6",
    "cleanlab>=2.6",
    "mapie>=0.8",
    "shap>=0.45",
    "mlflow>=2.14",
    "prefect>=3.0",
    "anthropic>=0.34",
    "plotly>=5.22",
    "evidently>=0.4.30",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "jinja2>=3.1",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlteam"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Torch CPU wheels are sufficient; TabPFN does not require CUDA for our use.
